<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bachatalingo</title>
  <meta name="description" content="Sprachen lernen mit Bachata-Remixen: Songtexte verstehen, Vokabeln sammeln, mitsingen. Mit Methoden von Polyglotten.">
  <meta name="theme-color" content="#131016" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#faf6f2" media="(prefers-color-scheme: light)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/motion.css">
  <script>
    // Theme vor dem ersten Zeichnen setzen (kein Aufblitzen)
    try {
      const t = JSON.parse(localStorage.getItem('bachatalingo.v1') || '{}')?.settings?.theme;
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <noscript><p style="padding:24px">Bachatalingo braucht JavaScript.</p></noscript>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
